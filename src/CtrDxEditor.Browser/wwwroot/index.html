<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <!-- Resolves to the directory this page is served from, so the app works from a domain
             root and from a GitHub Pages project subpath alike. It lives here rather than being
             injected at deploy time because publish hashes index.html into
             service-worker-assets.js, and a later edit would leave the shipped file failing the
             integrity check the service worker installs it with. -->
        <base href="./" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <link rel="icon" href="./favicon.ico" sizes="any" />
        <link rel="apple-touch-icon" href="./icon-512.png" />
        <link rel="manifest" href="./manifest.webmanifest" />

        <meta name="theme-color" content="#202329" />
        <meta name="mobile-web-app-capable" content="yes" />
        <title>Cut the Rope DX: Level Editor</title>

        <meta
            name="description"
            content="Create and edit custom Cut the Rope DX levels directly in your browser with the Cut the Rope DX: Level Editor."
        />

        <meta name="author" content="yell0wsuit" />
        <meta name="robots" content="index, follow" />

        <link
            rel="canonical"
            href="https://yell0wsuit.github.io/ctrdx-editor/"
        />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Cut the Rope DX: Level Editor" />
        <meta
            property="og:description"
            content="Create and edit custom Cut the Rope DX levels directly in your browser."
        />
        <meta
            property="og:url"
            content="https://yell0wsuit.github.io/ctrdx-editor/"
        />
        <meta
            property="og:image"
            content="https://yell0wsuit.github.io/ctrdx-editor/icon-512.png"
        />
        <meta property="og:site_name" content="Cut the Rope DX: Level Editor" />

        <!-- Twitter / X -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Cut the Rope DX: Level Editor" />
        <meta
            name="twitter:description"
            content="Create and edit custom Cut the Rope DX levels directly in your browser."
        />
        <meta
            name="twitter:image"
            content="https://yell0wsuit.github.io/ctrdx-editor/icon-512.png"
        />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "SoftwareApplication",
                "name": "Cut the Rope DX: Level Editor",
                "description": "A browser-based level editor for creating and editing custom Cut the Rope DX levels.",
                "applicationCategory": "DeveloperApplication",
                "operatingSystem": "Web browser",
                "isAccessibleForFree": true,
                "url": "https://yell0wsuit.github.io/ctrdx-editor/"
            }
        </script>
        <style>
            html,
            body,
            #out {
                height: 100%;
                margin: 0;
            }

            html,
            body,
            #out {
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
                overscroll-behavior: none;
            }

            #out input,
            #out textarea {
                -webkit-user-select: text;
                user-select: text;
            }

            #splash {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 20px;
                background: #202329;
                color: #e6e6e6;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                z-index: 1000;
                transition: opacity 0.25s ease-out;
            }

            #splash.hidden {
                opacity: 0;
                pointer-events: none;
            }

            #splash img {
                width: 96px;
                height: 96px;
            }

            #splash p,
            #splash h1 {
                margin: 0;
                text-align: center;
            }

            #splash h1 {
                font-size: 1.25rem;
                font-weight: 600;
            }

            #splash-hint {
                max-width: 320px;
                padding: 0 24px;
                font-size: 0.8rem;
                line-height: 1.45;
                opacity: 0.6;
            }

            #splash .spinner {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                border: 4px solid #3a3f47;
                border-top-color: #e6e6e6;
                animation: splash-spin 0.8s linear infinite;
            }

            @keyframes splash-spin {
                to {
                    transform: rotate(360deg);
                }
            }

            #update {
                padding: 20px 24px;
                border: 0;
                border-radius: 10px;
                background: #202329;
                color: #e6e6e6;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                box-shadow: 0 8px 32px rgb(0 0 0 / 50%);
            }

            #update::backdrop {
                background: rgb(0 0 0 / 50%);
            }

            #update p {
                margin: 0 0 16px;
            }

            #update-actions {
                display: flex;
                gap: 8px;
                justify-content: flex-end;
            }

            #update button {
                padding: 8px 18px;
                font-size: 0.95rem;
                border: 0;
                border-radius: 6px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div id="out"></div>
        <div id="splash">
            <img
                src="./icon-256.webp"
                width="96"
                height="96"
                alt="Cut the Rope DX: Level Editor icon"
                decoding="async"
            />
            <div class="spinner"></div>
            <p id="splash-progress">Now loading...</p>
            <h1>Cut the Rope DX: Level Editor</h1>
            <p id="splash-hint" role="status" hidden>
                Taking too long? You might want to check your internet speed, or
                reload the page.
            </p>
        </div>
        <dialog id="update">
            <p>A new version of the editor is ready.</p>
            <div id="update-actions">
                <button id="update-later">Later</button>
                <button id="update-now">Update</button>
            </div>
        </dialog>
        <script type="module" src="./pwa.js"></script>
        <script type="module" src="./save-fallback.js"></script>
        <script>
            // Hide the splash once Avalonia mounts content into #out (typically a canvas). A
            // MutationObserver is used rather than awaiting main.js's module promise, because
            // StartBrowserAppAsync's returned task does not resolve until the app itself exits -
            // it is not a "boot finished" signal. childList fires regardless of whether Avalonia
            // appends or replaces #out's children.
            const outEl = document.getElementById("out");
            const splashEl = document.getElementById("splash");
            const observer = new MutationObserver(() => {
                if (outEl.childElementCount > 0) {
                    splashEl.classList.add("hidden");
                    observer.disconnect();
                }
            });
            observer.observe(outEl, { childList: true });
        </script>
        <script type="module" src="./main.js"></script>
    </body>
</html>
