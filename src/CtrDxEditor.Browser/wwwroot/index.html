<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <link rel="icon" href="./favicon.ico" sizes="any" />
        <title>Cut the Rope DX: Level Editor</title>
        <style>
            html,
            body,
            #out {
                height: 100%;
                margin: 0;
            }

            html,
            body,
            #out {
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
                overscroll-behavior: none;
            }

            #out input,
            #out textarea {
                -webkit-user-select: text;
                user-select: text;
            }

            #splash {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 20px;
                background: #202329;
                color: #e6e6e6;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                z-index: 1000;
                transition: opacity 0.25s ease-out;
            }

            #splash.hidden {
                opacity: 0;
                pointer-events: none;
            }

            #splash img {
                width: 96px;
                height: 96px;
            }

            #splash p,
            #splash h1 {
                margin: 0;
                text-align: center;
            }

            #splash h1 {
                font-size: 1.25rem;
                font-weight: 600;
            }

            #splash .spinner {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                border: 4px solid #3a3f47;
                border-top-color: #e6e6e6;
                animation: splash-spin 0.8s linear infinite;
            }

            @keyframes splash-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div id="out"></div>
        <div id="splash">
            <img
                src="./icon-256.webp"
                width="96"
                height="96"
                alt="Cut the Rope DX: Level Editor icon"
                decoding="async"
            />
            <div class="spinner"></div>
            <p id="splash-progress">Now loading...</p>
            <h1>Cut the Rope DX: Level Editor</h1>
        </div>
        <script>
            // Hide the splash once Avalonia mounts content into #out (typically a canvas). A
            // MutationObserver is used rather than awaiting main.js's module promise, because
            // StartBrowserAppAsync's returned task does not resolve until the app itself exits -
            // it is not a "boot finished" signal. childList fires regardless of whether Avalonia
            // appends or replaces #out's children.
            const outEl = document.getElementById("out");
            const splashEl = document.getElementById("splash");
            const observer = new MutationObserver(() => {
                if (outEl.childElementCount > 0) {
                    splashEl.classList.add("hidden");
                    observer.disconnect();
                }
            });
            observer.observe(outEl, { childList: true });
        </script>
        <script type="module" src="./main.js"></script>
    </body>
</html>
