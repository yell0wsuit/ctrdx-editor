name: Deploy Browser to GitHub Pages

on:
    push:
        branches: [main]
        paths:
            - "src/**"
            - ".github/workflows/deploy-pages.yml"
    workflow_dispatch:

# Least-privilege token plus the OIDC id-token the Pages deploy needs.
permissions:
    contents: read
    pages: write
    id-token: write

# Never run two Pages deploys at once; let a newer push supersede an in-flight one.
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup-dotnet

            # Required for the browser-wasm publish (native relink; WasmNativeStrip).
            - name: Install wasm-tools workload
              run: dotnet workload install wasm-tools

            - name: Publish Browser head
              run: >
                  dotnet publish src/CtrDxEditor.Browser/CtrDxEditor.Browser.csproj
                  -c Release -o dist

            # Without this, GitHub Pages (Jekyll) drops the _framework/ runtime folder.
            - name: Disable Jekyll
              run: touch dist/wwwroot/.nojekyll

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: dist/wwwroot

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
