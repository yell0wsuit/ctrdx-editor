name: PR Code Quality

# Also runs on main so the caches the PR runs restore from exist there: a PR can read main's
# caches but never save one that another PR could use.
#
# Only changes the .NET build or tests can see wake it: code, XAML, project files, the test
# levels, and the localization files compiled in as resources.
on:
    push:
        branches: [main]
        paths: &quality-paths
            - "**/*.cs"
            - "**/*.axaml"
            - "**/*.csproj"
            - "**/*.props"
            - "**/*.targets"
            - "**/*.slnx"
            - "global.json"
            - "nuget.config"
            - "src/**/TestData/**"
            - "resources/localization/**"
            - ".github/workflows/pr-quality.yaml"
            - ".github/actions/**"
    pull_request:
        branches: [main]
        paths: *quality-paths

permissions:
    contents: read

jobs:
    code-quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - uses: ./.github/actions/setup-dotnet

            - name: Install WebAssembly workload
              run: dotnet workload install wasm-tools

            - name: Restore dependencies
              run: dotnet restore

            - name: Check formatting
              run: dotnet format --verify-no-changes --verbosity diagnostic

            - name: Build
              run: dotnet build --no-restore -c Release

            - name: Test
              run: dotnet test --no-build -c Release
